<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#040609">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>0x5ECCFA17</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #040609;
      --panel: rgba(4, 9, 13, 0.82);
      --cyan: #00f7ff;
      --green: #5cff9d;
      --pink: #ff3bd4;
      --violet: #9f7bff;
      --yellow: #f4ff5c;
      --orange: #ff9b46;
      --red: #ff405f;
      --muted: #6f858d;
      --mono: Courier, "Courier New", "Nimbus Mono PS", "Liberation Mono", monospace;
      --xray-black: #020202;
      --xray-dark: #343434;
      --xray-mid: #8d8d8d;
      --xray-light: #d4d4d4;
      --xray-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      font-family: var(--mono) !important;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
      font-synthesis: none;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #f7fbff;
      background:
        radial-gradient(circle at 50% 45%, rgba(0, 247, 255, 0.07), transparent 34rem),
        linear-gradient(180deg, #080b10 0%, var(--bg) 72%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0.17;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(255, 255, 255, 0.025) 4px
      );
    }

    .scene {
      position: fixed;
      inset: 0;
      z-index: 3;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 900ms ease, visibility 0s linear 900ms;
    }

    .scene.active {
      opacity: 1;
      visibility: visible;
      transition: opacity 900ms ease;
    }

    .banner {
      position: relative;
      z-index: 20;
      width: min(96vw, 980px);
      padding: clamp(0.35rem, 1.4vw, 0.9rem);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.08em, 0.7vw, 0.22em);
      text-align: center;
      background: transparent;
      border: 0;
      box-shadow: none;
      clip-path: none;
      transform: translate3d(0, 0, 0);
      transition: filter 900ms ease, opacity 900ms ease;
    }

    .title-bracket {
      flex: 0 0 auto;
      color: var(--cyan);
      font-size: clamp(2.25rem, 9.5vw, 7rem);
      font-weight: 400;
      line-height: 0.84;
      text-shadow:
        0 0 8px rgba(0, 247, 255, 0.7),
        0 0 24px rgba(0, 247, 255, 0.26);
      transition: color 900ms ease, text-shadow 900ms ease, filter 500ms ease, transform 500ms ease;
      user-select: none;
    }

    h1 {
      margin: 0;
      display: flex;
      justify-content: center;
      font-size: clamp(2.05rem, 9vw, 6.7rem);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: 0;
      gap: clamp(0.03em, 0.45vw, 0.09em);
      white-space: nowrap;
      isolation: isolate;
    }

    .glyph {
      position: relative;
      display: inline-block;
      width: 0.62em;
      min-width: 0.62em;
      text-align: center;
      color: var(--glyph-colour, var(--cyan));
      text-shadow:
        0 0 8px color-mix(in srgb, var(--glyph-colour, var(--cyan)) 72%, transparent),
        0 0 22px color-mix(in srgb, var(--glyph-colour, var(--cyan)) 34%, transparent);
      transition: color 1250ms ease, text-shadow 1250ms ease, transform 650ms ease, filter 500ms ease;
    }

    .glyph.shift { transform: translateY(-0.035em); }

    .glyph.xray-revealed {
      transition: none !important;
      color: var(--xray-grey, var(--xray-light)) !important;
      text-shadow: none !important;
      filter: grayscale(1) saturate(0) contrast(1.7) brightness(1.04) !important;
      -webkit-text-stroke: 0.01em rgba(255, 255, 255, 0.24);
    }

    .glyph.xray-current {
      transition: none !important;
      color: var(--xray-white) !important;
      background: linear-gradient(
        180deg,
        #ffffff 0 28%,
        #9c9c9c 28% 48%,
        #161616 48% 62%,
        #e5e5e5 62% 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none !important;
      filter: grayscale(1) saturate(0) contrast(2.1) brightness(1.12) !important;
      transform: scale(1.08);
    }

    body.scene-xray {
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.035), transparent 34rem),
        #020202;
    }

    body.scene-xray .banner {
      background: transparent;
      box-shadow: none;
    }

    body.scene-xray .title-bracket {
      color: #bcbcbc;
      text-shadow: none;
      filter: grayscale(1) saturate(0) contrast(1.7);
    }

    body.scene-xray #xrayScene {
      z-index: 45;
    }

    .instrument {
      position: fixed;
      color: rgba(0, 247, 255, 0.82);
      background: rgba(3, 7, 10, 0.66);
      border: 1px dotted rgba(0, 247, 255, 0.28);
      box-shadow: 0 0 20px rgba(0, 247, 255, 0.06);
      text-shadow: 0 0 6px currentColor;
      overflow: hidden;
    }

    .wave-panel {
      left: 50%;
      top: 6vh;
      width: min(90vw, 920px);
      min-height: clamp(150px, 27vh, 230px);
      transform: translateX(-50%);
      padding: 10px 9px 8px;
    }

    .wave-display {
      margin: 0;
      font-size: clamp(7px, 0.82vw, 12px);
      line-height: 0.9;
      white-space: pre;
      overflow: hidden;
    }

    #sineDisplay {
      color: var(--green);
      text-shadow: 0 0 8px rgba(92, 255, 157, 0.58);
    }

    #clockDisplay {
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(0, 247, 255, 0.62);
    }

    #dataDisplay {
      margin-top: 6px;
      color: var(--pink);
      text-shadow: 0 0 8px rgba(255, 59, 212, 0.58);
    }

    #squareBits {
      margin: 5px 0 0;
      min-height: 1em;
      overflow: hidden;
      color: rgba(244, 255, 92, 0.82);
      font-size: clamp(7px, 0.72vw, 10px);
      line-height: 1;
      letter-spacing: 0.09em;
      white-space: pre;
      text-shadow: 0 0 6px rgba(244, 255, 92, 0.45);
    }

    .memory-panel {
      left: 4vw;
      bottom: 4vh;
      width: min(40vw, 470px);
      min-width: 290px;
      padding-bottom: 6px;
    }

    .memory-panel.struck {
      animation: memory-thunder 1450ms steps(6, end);
    }

    #memoryGrid {
      padding: 10px 9px 5px;
      font-size: clamp(7px, 0.72vw, 10px);
      line-height: 1.24;
      color: rgba(92, 255, 157, 0.78);
      white-space: nowrap;
    }

    .memory-row {
      display: flex;
      align-items: center;
      gap: 0.8em;
      min-height: 1.24em;
    }

    .memory-address {
      color: rgba(159, 123, 255, 0.82);
      min-width: 5.4em;
    }

    .memory-bits { letter-spacing: 0.08em; }

    .memory-bit {
      display: inline-block;
      min-width: 0.7em;
      text-align: center;
    }

    .memory-bit.flipped {
      color: var(--red);
      text-shadow: 0 0 5px white, 0 0 15px var(--red);
      animation: bit-flip 850ms steps(4, end) 1;
    }

    .emi-panel {
      left: 50%;
      bottom: 4vh;
      width: min(88vw, 880px);
      transform: translateX(-50%);
      padding-bottom: 6px;
    }

    #bitStream,
    #powerTrace {
      margin: 0;
      white-space: pre;
      overflow: hidden;
    }

    #bitStream {
      padding: 10px 9px 4px;
      font-size: clamp(7px, 0.78vw, 11px);
      line-height: 1;
      color: rgba(0, 247, 255, 0.7);
      letter-spacing: 0.03em;
    }

    #bitStream .one {
      color: var(--pink);
      text-shadow: 0 0 8px rgba(255, 59, 212, 0.74);
    }

    #bitStream .zero { color: rgba(92, 255, 157, 0.38); }

    #powerTrace {
      padding: 0 9px 5px;
      font-size: clamp(7px, 0.76vw, 10px);
      line-height: 0.82;
      color: var(--yellow);
      text-shadow: 0 0 7px rgba(244, 255, 92, 0.52);
    }

    .scene-space {
      z-index: 26;
      overflow: hidden;
    }

    .space-starfield {
      position: fixed;
      inset: -12%;
      opacity: 0.62;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.92) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(0, 247, 255, 0.72) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(159, 123, 255, 0.62) 0 1px, transparent 1.5px);
      background-size: 83px 79px, 137px 131px, 191px 173px;
      background-position: 0 0, 41px 27px, 79px 51px;
      filter: drop-shadow(0 0 4px rgba(0, 247, 255, 0.24));
      animation: starfield-drift 22s linear infinite;
    }

    .space-craft {
      position: fixed;
      left: 0;
      top: 0;
      margin: 0;
      white-space: pre;
      font-weight: 400;
      line-height: 0.86;
      text-align: center;
      color: var(--craft-colour, var(--cyan));
      text-shadow:
        0 0 5px currentColor,
        0 0 16px color-mix(in srgb, currentColor 70%, transparent),
        0 0 34px color-mix(in srgb, currentColor 32%, transparent);
      filter: drop-shadow(0 0 8px currentColor);
      will-change: transform, opacity, filter;
      user-select: none;
    }

    .space-craft.mothership {
      font-size: clamp(8px, 1.02vw, 14px);
      color: var(--violet);
    }

    .space-craft.scout {
      font-size: clamp(7px, 0.82vw, 11px);
      color: var(--cyan);
    }

    .space-craft.interceptor {
      font-size: clamp(7px, 0.78vw, 10px);
      color: var(--green);
    }

    .space-beam {
      position: fixed;
      left: 0;
      top: 0;
      width: clamp(90px, 12vw, 150px);
      height: min(42vh, 390px);
      opacity: 0;
      transform-origin: 50% 0;
      clip-path: polygon(43% 0, 57% 0, 100% 100%, 0 100%);
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0 7px,
          rgba(92, 255, 157, 0.1) 8px 9px
        ),
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.48),
          rgba(0, 247, 255, 0.18) 18%,
          rgba(92, 255, 157, 0.1) 62%,
          transparent
        );
      filter: blur(0.3px) drop-shadow(0 0 14px rgba(0, 247, 255, 0.44));
      transition: opacity 480ms ease;
      will-change: left, top, opacity, transform;
    }

    .space-beam.visible {
      opacity: 0.88;
      animation: beam-flicker 900ms steps(6, end) infinite;
    }

    .space-pulse {
      position: fixed;
      width: 8px;
      height: 8px;
      border: 1px solid currentColor;
      border-radius: 50%;
      color: var(--cyan);
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 12px currentColor, inset 0 0 8px currentColor;
      animation: space-pulse-out 1600ms ease-out forwards;
    }

    .xray-band,
    .uv-band {
      position: fixed;
      top: 0;
      height: 100vh;
      pointer-events: none;
      will-change: transform;
    }

    .xray-band {
      left: 0;
      z-index: 2;
      width: clamp(126px, 16vw, 236px);
      overflow: hidden;
      opacity: 0;
      border-left: 1px solid rgba(95, 95, 95, 0.9);
      border-right: 2px solid rgba(255, 255, 255, 0.98);
      background:
        linear-gradient(to right,
          rgba(0, 0, 0, 0.48) 0%,
          rgba(34, 34, 34, 0.42) 22%,
          rgba(155, 155, 155, 0.28) 62%,
          rgba(255, 255, 255, 0.16) 84%,
          rgba(255, 255, 255, 0.04) 100%);
      box-shadow:
        18px 0 54px rgba(255, 255, 255, 0.18),
        -8px 0 30px rgba(0, 0, 0, 0.5),
        inset 0 0 38px rgba(255, 255, 255, 0.12);
      backdrop-filter: grayscale(1) saturate(0) contrast(2.25) brightness(0.72);
      -webkit-backdrop-filter: grayscale(1) saturate(0) contrast(2.25) brightness(0.72);
      mix-blend-mode: normal;
    }

    .xray-band.from-right {
      border-left: 2px solid rgba(255, 255, 255, 0.98);
      border-right: 1px solid rgba(95, 95, 95, 0.9);
      background:
        linear-gradient(to left,
          rgba(0, 0, 0, 0.48) 0%,
          rgba(34, 34, 34, 0.42) 22%,
          rgba(155, 155, 155, 0.28) 62%,
          rgba(255, 255, 255, 0.16) 84%,
          rgba(255, 255, 255, 0.04) 100%);
      box-shadow:
        -18px 0 54px rgba(255, 255, 255, 0.18),
        8px 0 30px rgba(0, 0, 0, 0.5),
        inset 0 0 38px rgba(255, 255, 255, 0.12);
    }

    .xray-bits {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 0.45rem 0.5rem;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(6px, 0.62vw, 9px);
      line-height: 1.08;
      letter-spacing: 0.12em;
      white-space: pre;
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.5);
      mix-blend-mode: normal;
    }

    .hscan-band {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 4;
      width: 100vw;
      height: clamp(92px, 14vh, 172px);
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      will-change: transform;
      border-top: 1px solid rgba(0, 247, 255, 0.58);
      border-bottom: 2px solid rgba(255, 255, 255, 0.88);
      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.03) 0%,
          rgba(0, 247, 255, 0.08) 18%,
          rgba(2, 10, 14, 0.76) 44%,
          rgba(92, 255, 157, 0.09) 76%,
          rgba(255, 255, 255, 0.025) 100%
        );
      box-shadow:
        0 18px 48px rgba(0, 247, 255, 0.12),
        0 -12px 34px rgba(0, 0, 0, 0.52),
        inset 0 0 34px rgba(0, 247, 255, 0.08);
      backdrop-filter: contrast(1.22) brightness(0.72) saturate(0.82);
      -webkit-backdrop-filter: contrast(1.22) brightness(0.72) saturate(0.82);
    }

    .hscan-band.from-bottom {
      border-top: 2px solid rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid rgba(0, 247, 255, 0.58);
      background:
        linear-gradient(
          to top,
          rgba(255, 255, 255, 0.03) 0%,
          rgba(0, 247, 255, 0.08) 18%,
          rgba(2, 10, 14, 0.76) 44%,
          rgba(92, 255, 157, 0.09) 76%,
          rgba(255, 255, 255, 0.025) 100%
        );
      box-shadow:
        0 -18px 48px rgba(0, 247, 255, 0.12),
        0 12px 34px rgba(0, 0, 0, 0.52),
        inset 0 0 34px rgba(0, 247, 255, 0.08);
    }

    .hscan-bits {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 0.45rem 0.35rem;
      overflow: hidden;
      color: rgba(92, 255, 157, 0.72);
      font-size: clamp(6px, 0.68vw, 10px);
      line-height: 1.08;
      letter-spacing: 0.13em;
      white-space: pre;
      text-shadow:
        0 0 3px rgba(92, 255, 157, 0.65),
        0 0 10px rgba(0, 247, 255, 0.18);
      opacity: 0.76;
      transition: opacity 90ms steps(1, end), color 140ms steps(2, end), filter 140ms steps(2, end);
    }

    .hscan-bits.live-pulse {
      opacity: 1;
      color: rgba(225, 255, 238, 0.98);
      filter: brightness(1.55) contrast(1.2);
      text-shadow:
        0 0 4px rgba(255, 255, 255, 0.92),
        0 0 13px rgba(0, 247, 255, 0.52);
    }

    .uv-band {
      left: 0;
      width: clamp(110px, 14vw, 190px);
      opacity: 0;
      border-left: 1px solid rgba(196, 105, 255, 0.2);
      border-right: 1px solid rgba(255, 59, 212, 0.58);
      background: linear-gradient(to right, transparent, rgba(151, 71, 255, 0.04) 24%, rgba(255, 59, 212, 0.14) 70%, rgba(255, 59, 212, 0.02));
      box-shadow: 18px 0 46px rgba(159, 123, 255, 0.08);
      backdrop-filter: hue-rotate(82deg) saturate(1.8) contrast(1.06);
    }

    .shock-overlay {
      position: fixed;
      inset: 0;
      opacity: 0;
      background:
        repeating-linear-gradient(118deg, transparent 0 34px, rgba(255, 255, 255, 0.25) 35px, transparent 38px),
        rgba(0, 247, 255, 0.05);
      mix-blend-mode: screen;
    }

    .arc,
    .steam {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 32;
      margin: 0;
      pointer-events: none;
      user-select: none;
      white-space: pre;
    }

    .arc {
      color: var(--arc-colour, white);
      font-size: var(--arc-size, 13px);
      text-shadow: 0 0 5px currentColor, 0 0 20px currentColor;
      opacity: 0;
      transform-origin: left center;
      animation: arc-strike 1100ms steps(4, end) forwards;
    }

    .steam {
      color: rgba(225, 248, 255, 0.82);
      font-size: var(--steam-size, 9px);
      text-shadow: 0 0 7px rgba(190, 240, 255, 0.72);
      transform: translate(-50%, -50%);
      animation: steam-rise 2200ms ease-out forwards;
    }

    .skull-particle,
    .skull-burst {
      position: fixed;
      z-index: 45;
      pointer-events: none;
      user-select: none;
      color: var(--particle-colour, var(--cyan));
      font-family: var(--mono);
      text-shadow: 0 0 7px currentColor, 0 0 15px currentColor;
      transform: translate(-50%, -50%);
    }

    .skull-particle {
      font-size: var(--particle-size, 9px);
      animation: skull-sprinkle 2300ms ease-out forwards;
    }

    .skull-burst {
      font-size: var(--burst-size, 11px);
      animation: skull-burst 1500ms cubic-bezier(.18,.8,.22,1) forwards;
    }

    .skull-link {
      position: fixed;
      z-index: 46;
      left: 50%;
      top: calc(100% - 74px);
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      color: #56666b;
      text-decoration: none;
      border-radius: 50%;
      transition:
        left 6200ms cubic-bezier(.22, .72, .24, 1),
        top 6200ms cubic-bezier(.22, .72, .24, 1),
        color 800ms ease,
        transform 800ms ease;
      will-change: left, top;
    }

    .skull-halo {
      position: absolute;
      inset: -7px;
      border: 1px solid currentColor;
      border-radius: 50%;
      opacity: 0.18;
      box-shadow:
        0 0 10px currentColor,
        0 0 26px currentColor,
        inset 0 0 18px currentColor;
      transform: scale(0.84);
      transition: opacity 900ms ease, transform 1200ms ease, box-shadow 900ms ease;
      user-select: none;
      pointer-events: none;
    }

    .ascii-skull {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: 8px;
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0;
      text-align: left;
      white-space: pre;
      filter: drop-shadow(0 0 5px currentColor);
      user-select: none;
    }

    .skull-link {
      color: var(--skull-colour, var(--cyan));
      animation: skull-neon-blink 4800ms steps(1, end) infinite;
    }

    .skull-halo {
      opacity: 0.72;
      transform: scale(1.08);
      animation: halo-breathe 5200ms ease-in-out infinite;
    }

    body.scene-shock .banner {
      animation: banner-electrocute 2500ms steps(8, end);
    }

    body.scene-shock .title-bracket {
      animation: glyph-electrocute 2500ms steps(9, end);
    }

    body.scene-shock .shock-overlay {
      animation: shock-flash 2500ms steps(8, end);
    }

    body.scene-shock .glyph {
      animation: glyph-electrocute 2500ms steps(9, end);
    }

    body.scene-shock .glyph:nth-child(2n) { animation-delay: 45ms; }
    body.scene-shock .glyph:nth-child(3n) { animation-delay: 90ms; }

    body.scene-shock .glyph::before,
    body.scene-shock .glyph::after {
      content: attr(data-shock);
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
    }

    body.scene-shock .glyph::before {
      color: #ffffff;
      text-shadow: 0 0 6px #ffffff, 0 0 18px var(--cyan);
      animation: split-before 2500ms steps(7, end);
    }

    body.scene-shock .glyph::after {
      color: var(--pink);
      text-shadow: 0 0 8px var(--pink);
      animation: split-after 2500ms steps(7, end);
    }

    @keyframes memory-thunder {
      0%, 100% { transform: none; filter: none; }
      12% { transform: translate(-3px, 1px); filter: brightness(2.1) contrast(1.8); }
      24% { transform: translate(3px, -2px); filter: invert(0.72) grayscale(1); }
      42% { transform: translate(-1px, 1px); filter: brightness(1.5); }
      58% { transform: translate(2px, 0); filter: none; }
    }

    @keyframes skull-sprinkle {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.45); }
      18% { opacity: 0.95; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--drift-x, 0px)), calc(-50% + var(--drift-y, -24px))) rotate(var(--spin, 0deg)) scale(1.25); }
    }

    @keyframes skull-burst {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4); }
      70% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--burst-x, 0px)), calc(-50% + var(--burst-y, 0px))) rotate(var(--spin, 0deg)) scale(1.4); }
    }

    @keyframes bit-flip {
      0%, 100% { transform: translate(0, 0) scale(1); }
      20% { transform: translate(-2px, -1px) scale(1.22); }

(0 0)
| = |
`---'</pre>

  <script>
    (() => {
      const source = "0x5eccfa17";
      const xrayTarget = "0xSeccfaLT";
      const colours = ["#00f7ff", "#5cff9d", "#ff3bd4", "#9f7bff", "#f4ff5c"];
      const greys = ["#f3f3f3", "#c9c9c9", "#8c8c8c", "#3f3f3f"];
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const body = document.body;
      const title = document.querySelector("#identity");
      const banner = document.querySelector(".banner");
      const skull = document.querySelector(".skull-link");
      const scenes = [...document.querySelectorAll(".scene")];
      const spaceScene = document.querySelector("#spaceScene");
      const spaceBeam = document.querySelector("#spaceBeam");
      const sineScene = document.querySelector("#sineScene");
      const squareScene = document.querySelector("#squareScene");
      const emiScene = document.querySelector("#emiScene");
      const memoryScene = document.querySelector("#memoryScene");
      const xrayScene = document.querySelector("#xrayScene");
      const hscanScene = document.querySelector("#hscanScene");
      const uvScene = document.querySelector("#uvScene");
      const shockScene = document.querySelector("#shockScene");
      const sineDisplay = document.querySelector("#sineDisplay");
      const clockDisplay = document.querySelector("#clockDisplay");
      const dataDisplay = document.querySelector("#dataDisplay");
      const squareBits = document.querySelector("#squareBits");
      const memoryGrid = document.querySelector("#memoryGrid");
      const memoryPanel = document.querySelector(".memory-panel");
      const bitStream = document.querySelector("#bitStream");
      const powerTrace = document.querySelector("#powerTrace");
      const xrayBand = document.querySelector("#xrayBand");
      const xrayBits = document.querySelector("#xrayBits");
      const hscanBand = document.querySelector("#hscanBand");
      const hscanBits = document.querySelector("#hscanBits");
      const uvBand = document.querySelector("#uvBand");

      const randomBetween = (min, max) => min + Math.random() * (max - min);
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const randomColour = () => colours[Math.floor(Math.random() * colours.length)];
      const sleep = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

      const glyphs = [...source].map((character, index) => {
        const glyph = document.createElement("span");
        glyph.className = "glyph";
        glyph.textContent = character;
        glyph.dataset.base = character;
        glyph.dataset.shock = character;
        glyph.style.setProperty("--glyph-colour", colours[index % colours.length]);
        glyph.style.setProperty("--xray-grey", greys[index % greys.length]);

      });

      let currentScene = "";
      let sceneToken = 0;
      let titleMutationTimer = 0;
      let sineTimer = 0;
      let squareTimer = 0;
      let emiTimer = 0;
      let hscanTimer = 0;
      let spaceAnimation = 0;

      const clearSceneTimers = () => {
        window.clearInterval(titleMutationTimer);
        window.clearInterval(sineTimer);
        window.clearInterval(squareTimer);
        window.clearInterval(emiTimer);
        window.clearInterval(hscanTimer);
        window.cancelAnimationFrame(spaceAnimation);
        titleMutationTimer = 0;
        sineTimer = 0;
        squareTimer = 0;
        emiTimer = 0;
        hscanTimer = 0;
        spaceAnimation = 0;
      };

      const activateScene = (name, sceneElement = null) => {
        sceneToken += 1;
        clearSceneTimers();
        currentScene = name;
        scenes.forEach((scene) => scene.classList.toggle("active", scene === sceneElement));
        body.className = name ? `scene-${name}` : "";
        return sceneToken;
      };

      const restoreIdentity = () => {
        glyphs.forEach((glyph) => {
          glyph.textContent = glyph.dataset.base;
          glyph.dataset.shock = glyph.dataset.base;
          glyph.classList.remove("xray-revealed", "xray-current", "shift");
        });
      };

      const runIdentityScene = async () => {
        const token = activateScene("identity");
        restoreIdentity();
        titleMutationTimer = window.setInterval(() => {
          const glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
          const base = glyph.dataset.base;
          if (/[a-z]/i.test(base)) {
            glyph.textContent = Math.random() > 0.5 ? base.toUpperCase() : base.toLowerCase();
            glyph.classList.toggle("shift", Math.random() > 0.72);
          }
          glyph.style.setProperty("--glyph-colour", randomColour());
        }, 1450);
        await sleep(10500);
        if (token !== sceneToken) return;
        restoreIdentity();
      };

      const bs = String.fromCharCode(92);
      const shipSprites = {
        mothership: [
          [
            "              .-===========-.",
            "          .-''   .-----.     ''-.",
            "     ____/______/_______" + bs + "__________" + bs + "____",
            "   <____   ____|  o o  |____   ______>",
            "        " + bs + "_/    |  ---  |    " + bs + "_/",
            "          '----|_______|----'",
            "              /_/   " + bs + "_" + bs
          ].join("\n"),
          [
            "              .-===========-.",
            "          .-''   .-----.     ''-.",
            "     ____/______/_______" + bs + "__________" + bs + "____",
            "   <____   ____|  O O  |____   ______>",
            "        " + bs + "_/    |  ---  |    " + bs + "_/",
            "          '----|_______|----'",
            "              " + bs + "_" + bs + "   /_/"
          ].join("\n")
        ],
        scout: [
          [
            "          /" + bs,
            "     ____/==" + bs + "____",
            "  __/___/____" + bs + "___" + bs + "__",
            " <_____|_00_|_____>",
            "      /_/  " + bs + "_" + bs
          ].join("\n"),
          [
            "          /" + bs,
            "     ____/==" + bs + "____",
            "  __/___/____" + bs + "___" + bs + "__",
            " <_____|_.._|_____>",
            "       " + bs + "_" + bs + "/_/"
          ].join("\n")
        ],
        interceptor: [
          [
            "        /|",
            "   ____/ |____",
            "==<____   ____>==",
            "       " + bs + "_|"
          ].join("\n"),
          [
            "        |" + bs,
            "   ____| " + bs + "____",
            "==<____   ____>==",
            "       |_ /"
          ].join("\n")
        ]
      };

      const shipSpecs = [
        { type: "mothership", direction: 1, speed: 54, y: 0.18, amplitude: 16, phase: 0.2, delay: 0 },
        { type: "scout", direction: -1, speed: 92, y: 0.60, amplitude: 54, phase: 2.1, delay: 1700 },
        { type: "interceptor", direction: 1, speed: 124, y: 0.76, amplitude: 34, phase: 4.0, delay: 3600 }
      ];

      const ships = shipSpecs.map((spec) => {
        const element = document.createElement("pre");
        element.className = `space-craft ${spec.type}`;
        element.setAttribute("aria-hidden", "true");
        spaceScene.appendChild(element);
        return {
          ...spec,
          element,
          frame: 0,
          x: 0,
          started: false,
          startAt: 0,
          lastFrameChange: 0,
          width: 190,
          height: 70
        };
      });

      const paintShip = (ship) => {
        ship.element.textContent = shipSprites[ship.type][ship.frame];
      };

      ships.forEach(paintShip);

      const resetShips = (now) => {
        ships.forEach((ship, index) => {
          ship.x = ship.direction > 0
            ? -260 - index * 120
            : window.innerWidth + 260 + index * 120;
          ship.startAt = now + ship.delay;
          ship.started = false;
          ship.frame = 0;
          ship.lastFrameChange = now;
          ship.element.style.opacity = "0";
          paintShip(ship);
        });
        spaceBeam.classList.remove("visible");
      };

      const spawnSpacePulse = (x, y, colour) => {
        const pulse = document.createElement("span");
        pulse.className = "space-pulse";
        pulse.style.left = `${x}px`;
        pulse.style.top = `${y}px`;
        pulse.style.color = colour;
        spaceScene.appendChild(pulse);
        window.setTimeout(() => pulse.remove(), 1700);
      };

      const runSpaceScene = async () => {
        const token = activateScene("space", spaceScene);
        const sceneStart = performance.now();
        resetShips(sceneStart);
        let lastFrame = sceneStart;
        let beamShown = false;
        let pulseOne = false;
        let pulseTwo = false;

        const animate = (now) => {
          if (token !== sceneToken) return;
          const elapsed = now - sceneStart;
          const dt = Math.min(0.05, (now - lastFrame) / 1000);
          lastFrame = now;

          ships.forEach((ship, index) => {
            if (now < ship.startAt) return;
            if (!ship.started) {
              ship.started = true;
              ship.element.style.opacity = "0.96";
              ship.element.style.setProperty("--craft-colour", colours[(index + 1) % colours.length]);
            }

            ship.x += ship.direction * ship.speed * dt;
            const y = window.innerHeight * ship.y + Math.sin(now * 0.00075 + ship.phase) * ship.amplitude;
            const edge = 300;
            if (ship.direction > 0 && ship.x > window.innerWidth + edge) ship.x = -edge;
            if (ship.direction < 0 && ship.x < -edge) ship.x = window.innerWidth + edge;

            if (now - ship.lastFrameChange > 620 + index * 140) {
              ship.frame = 1 - ship.frame;
              paintShip(ship);
              ship.lastFrameChange = now;
            }

            const tilt = Math.sin(now * 0.0009 + ship.phase) * (ship.type === "mothership" ? 1.1 : 3.2);
            ship.element.style.transform = `translate3d(${ship.x}px, ${y}px, 0) scaleX(${ship.direction}) rotate(${tilt}deg)`;

            if (ship.type === "mothership") {
              const rect = ship.element.getBoundingClientRect();
              spaceBeam.style.left = `${rect.left + rect.width * 0.5 - 65}px`;
              spaceBeam.style.top = `${rect.bottom - 5}px`;
            }
          });

          if (!beamShown && elapsed > 5600) {
            beamShown = true;
            spaceBeam.classList.add("visible");
          }
          if (beamShown && elapsed > 8700) spaceBeam.classList.remove("visible");
          if (!pulseOne && elapsed > 3900) {
            pulseOne = true;
            spawnSpacePulse(window.innerWidth * 0.28, window.innerHeight * 0.42, colours[0]);
          }
          if (!pulseTwo && elapsed > 11100) {
            pulseTwo = true;
            spawnSpacePulse(window.innerWidth * 0.72, window.innerHeight * 0.58, colours[2]);
          }

          spaceAnimation = requestAnimationFrame(animate);
        };

        spaceAnimation = requestAnimationFrame(animate);
        await sleep(15000);
      };

      const sineRows = 13;
      const sineCols = 96;
      const sineHistory = Array.from({ length: sineCols }, (_, index) => ({
        value: Math.sin((index - sineCols) * 0.23),
        fault: false
      }));
      let sinePhase = sineCols * 0.23;
      let sineSceneStarted = 0;
      let sineBurst = 0;
      let sineDropout = 0;

      const renderSine = () => {
        const grid = Array.from({ length: sineRows }, () => Array(sineCols).fill(" "));
        const centreRow = Math.floor(sineRows / 2);
        for (let column = 0; column < sineCols; column += 1) {
          if (column % 2 === 0) grid[centreRow][column] = ".";
        }
        let previousRow = centreRow;
        sineHistory.forEach((point, column) => {
          const row = clamp(Math.round(centreRow - point.value * 4.7), 0, sineRows - 1);
          const low = Math.min(previousRow, row);
          const high = Math.max(previousRow, row);
          for (let bridge = low + 1; bridge < high; bridge += 1) {
            grid[bridge][column] = point.fault ? "#" : "|";
          }
          if (point.fault) {
            grid[row][column] = ["#", "!", "?", "x"][column % 4];
          } else if (row < previousRow) {
            grid[row][column] = "/";
          } else if (row > previousRow) {
            grid[row][column] = bs;
          } else {
            grid[row][column] = "-";
          }
          previousRow = row;
        });
        sineDisplay.textContent = grid.map((row) => row.join("")).join("\n");
      };

      const stepSine = () => {
        const elapsed = performance.now() - sineSceneStarted;
        const corruption = clamp((elapsed - 4800) / 7600, 0, 1);
        const phaseJitter = (Math.random() - 0.5) * 0.055 * corruption;
        sinePhase += 0.23 + phaseJitter;
        let value = Math.sin(sinePhase);
        let fault = false;

        if (corruption > 0) {
          value *= 1 + Math.sin(sinePhase * 0.19) * 0.16 * corruption;
          value += (Math.random() - 0.5) * 0.16 * corruption;

          if (sineBurst <= 0 && Math.random() < 0.035 * corruption) {
            sineBurst = 2 + Math.floor(Math.random() * 6);
          }
          if (sineDropout <= 0 && Math.random() < 0.018 * corruption) {
            sineDropout = 2 + Math.floor(Math.random() * 5);
          }
          if (sineBurst > 0) {
            value += randomBetween(-1.35, 1.35) * (0.45 + corruption * 0.72);
            sineBurst -= 1;
            fault = true;
          }
          if (sineDropout > 0) {
            value = Math.sin(sinePhase) * 0.04;
            sineDropout -= 1;
            fault = true;
          }
          if (Math.random() < 0.012 * corruption) {
            value = value > 0 ? 1.27 : -1.27;
            fault = true;
          }
        }

        sineHistory.shift();
        sineHistory.push({ value: clamp(value, -1.3, 1.3), fault });
        renderSine();
      };

      const resetSine = () => {
        sinePhase = sineCols * 0.23;
        sineBurst = 0;
        sineDropout = 0;
        sineHistory.splice(0, sineHistory.length, ...Array.from({ length: sineCols }, (_, index) => ({
          value: Math.sin((index - sineCols) * 0.23),
          fault: false
        })));
        renderSine();
      };

      const runSineScene = async () => {
        activateScene("sine", sineScene);
        resetSine();
        sineSceneStarted = performance.now();
        sineTimer = window.setInterval(stepSine, 125);
        await sleep(14500);
      };

      const squareCols = 96;
      const clockHistory = [];
      const dataHistory = [];
      const clockIdealHistory = [];
      const dataIdealHistory = [];
      let squareSample = 0;
      let squareSceneStarted = 0;
      let clockFaultMode = "";
      let clockFaultTicks = 0;
      let dataFaultMode = "";
      let dataFaultTicks = 0;
      const dataPattern = [1, 0, 1, 1, 0, 0, 1, 0, 1, 0, 0, 1, 1, 1, 0, 0];

      const idealClockAt = (sample) => Math.floor(sample / 4) % 2;
      const idealDataAt = (sample) => dataPattern[Math.floor(sample / 8) % dataPattern.length];

      const drawDigitalTrace = (history, idealHistory, rows = 5) => {
        const grid = Array.from({ length: rows }, () => Array(squareCols).fill(" "));
        const highRow = 1;
        const lowRow = rows - 2;
        let previous = history[0] ?? 0;
        history.forEach((level, column) => {
          const ideal = idealHistory[column];
          const faulty = level === "x" || level !== ideal;
          if (level === "x") {
            grid[Math.floor(rows / 2)][column] = column % 2 ? "x" : "#";
          } else {
            const row = level ? highRow : lowRow;
            grid[row][column] = faulty ? "!" : (level ? "-" : "_");
            if (column > 0 && previous !== level && previous !== "x") {
              const low = Math.min(row, previous ? highRow : lowRow);
              const high = Math.max(row, previous ? highRow : lowRow);
              for (let bridge = low; bridge <= high; bridge += 1) {
                grid[bridge][column] = faulty ? "#" : "|";
              }
            }
          }
          previous = level;
        });
        return grid.map((row) => row.join("")).join("\n");
      };

      const renderSquare = () => {
        clockDisplay.textContent = drawDigitalTrace(clockHistory, clockIdealHistory, 5);
        dataDisplay.textContent = drawDigitalTrace(dataHistory, dataIdealHistory, 5);
        let bits = "";
        const visibleStart = squareSample - squareCols;
        for (let column = 0; column < squareCols; column += 1) {
          const absoluteSample = visibleStart + column;
          const boundary = ((absoluteSample % 8) + 8) % 8 === 4;
          if (!boundary) {
            bits += " ";
            continue;
          }
          const level = dataHistory[column];
          bits += level === "x" ? "x" : String(level);
        }
        squareBits.textContent = bits;
      };

      const nextFaultMode = (kind) => {
        if (kind === "clock") return ["missing-edge", "runt", "stuck-high", "stuck-low", "extra-edge"][Math.floor(Math.random() * 5)];
        return ["flip", "metastable", "stuck-high", "stuck-low", "narrow-pulse"][Math.floor(Math.random() * 5)];
      };

      const stepSquare = () => {
        const elapsed = performance.now() - squareSceneStarted;
        const corruption = clamp((elapsed - 5000) / 7600, 0, 1);
        const idealClock = idealClockAt(squareSample);
        const idealData = idealDataAt(squareSample);
        let clock = idealClock;
        let data = idealData;

        if (corruption > 0) {
          if (clockFaultTicks <= 0 && (squareSample % 47 === 0 || Math.random() < 0.05 * corruption)) {
            clockFaultMode = nextFaultMode("clock");
            clockFaultTicks = 2 + Math.floor(Math.random() * 9);
          }
          if (dataFaultTicks <= 0 && (squareSample % 53 === 0 || Math.random() < 0.045 * corruption)) {
            dataFaultMode = nextFaultMode("data");
            dataFaultTicks = 2 + Math.floor(Math.random() * 10);
          }

          if (clockFaultTicks > 0) {
            if (clockFaultMode === "missing-edge") clock = clockHistory.at(-1) ?? idealClock;
            if (clockFaultMode === "runt") clock = squareSample % 2 ? 1 : 0;
            if (clockFaultMode === "stuck-high") clock = 1;
            if (clockFaultMode === "stuck-low") clock = 0;
            if (clockFaultMode === "extra-edge") clock = idealClock ? 0 : 1;
            clockFaultTicks -= 1;
          }

          if (dataFaultTicks > 0) {
            if (dataFaultMode === "flip") data = idealData ? 0 : 1;
            if (dataFaultMode === "metastable") data = "x";
            if (dataFaultMode === "stuck-high") data = 1;
            if (dataFaultMode === "stuck-low") data = 0;
            if (dataFaultMode === "narrow-pulse") data = squareSample % 2 ? idealData : (idealData ? 0 : 1);
            dataFaultTicks -= 1;
          }
        }

        clockHistory.shift();
        clockHistory.push(clock);
        dataHistory.shift();
        dataHistory.push(data);
        clockIdealHistory.shift();
        clockIdealHistory.push(idealClock);
        dataIdealHistory.shift();
        dataIdealHistory.push(idealData);
        squareSample += 1;
        renderSquare();
      };

      const resetSquare = () => {
        squareSample = squareCols;
        clockFaultMode = "";
        dataFaultMode = "";
        clockFaultTicks = 0;
        dataFaultTicks = 0;
        clockHistory.length = 0;
        dataHistory.length = 0;
        clockIdealHistory.length = 0;
        dataIdealHistory.length = 0;
        for (let sample = 0; sample < squareCols; sample += 1) {
          const clock = idealClockAt(sample);
          const data = idealDataAt(sample);
          clockHistory.push(clock);
          dataHistory.push(data);
          clockIdealHistory.push(clock);
          dataIdealHistory.push(data);
        }
        renderSquare();
      };

      const runSquareScene = async () => {
        activateScene("square", squareScene);
        resetSquare();
        squareSceneStarted = performance.now();
        squareTimer = window.setInterval(stepSquare, 140);
        await sleep(14800);
      };

      const streamWidth = 76;
      const streamBits = Array.from({ length: streamWidth }, () => Math.random() > 0.55 ? 1 : 0);
      const powerSamples = Array.from({ length: streamWidth }, () => 1);
      let oneProbability = 0.3;
      let targetProbability = 0.78;
      let probabilityHold = 0;

      const renderBitStream = () => {
        bitStream.innerHTML = streamBits.map((bit, index) => {
          const separator = index > 0 && index % 8 === 0 ? " " : "";
          return `${separator}<span class="${bit ? "one" : "zero"}">${bit}</span>`;
        }).join("");
        const recent = streamBits.slice(-20);
        const density = recent.reduce((sum, bit) => sum + bit, 0) / recent.length;
      };

      const renderPowerTrace = () => {
        const rows = 7;
        const grid = Array.from({ length: rows }, () => Array(streamWidth).fill(" "));
        let previousRow = rows - 1;
        powerSamples.forEach((sample, column) => {
          const row = clamp(rows - 1 - Math.round(sample), 0, rows - 1);
          for (let bridge = Math.min(row, previousRow) + 1; bridge < Math.max(row, previousRow); bridge += 1) grid[bridge][column] = "|";
          grid[row][column] = sample > 5 ? "#" : sample > 3.6 ? "*" : sample > 2 ? "+" : ".";
          previousRow = row;
        });
        powerTrace.textContent = grid.map((row, index) => `${rows - 1 - index} ${row.join("")}`).join("\n");
      };

      const stepBitStream = () => {
        probabilityHold -= 1;
        if (probabilityHold <= 0) {
          targetProbability = randomBetween(0.12, 0.92);
          probabilityHold = 20 + Math.floor(Math.random() * 42);
        }
        oneProbability += (targetProbability - oneProbability) * 0.045;
        const bit = Math.random() < oneProbability ? 1 : 0;
        streamBits.shift();
        streamBits.push(bit);
        const recent = streamBits.slice(-18);
        const density = recent.reduce((sum, value) => sum + value, 0) / recent.length;
        const switching = recent.slice(1).reduce((sum, value, index) => sum + (value !== recent[index] ? 1 : 0), 0) / 17;
        const power = clamp(density * 5.25 + switching * 0.85 + bit * 0.62 + Math.random() * 0.25, 0, 6);
        powerSamples.shift();
        powerSamples.push(power);
        renderBitStream();
        renderPowerTrace();
      };

      const runEmiScene = async () => {
        activateScene("emi", emiScene);
        renderBitStream();
        renderPowerTrace();
        emiTimer = window.setInterval(stepBitStream, 255);
        await sleep(13000);
      };

      const memoryWords = Array.from({ length: 6 }, (_, row) => (
        Array.from({ length: 16 }, (_, bit) => ((row * 5 + bit * 3 + 1) % 7 > 3 ? 1 : 0))
      ));
      const memoryBitElements = [];

      const buildMemory = () => {
        memoryGrid.textContent = "";
        memoryBitElements.length = 0;
        memoryWords.forEach((word, rowIndex) => {
          const row = document.createElement("div");
          row.className = "memory-row";
          const address = document.createElement("span");
          address.className = "memory-address";
          address.textContent = `0x${(0x80 + rowIndex * 0x10).toString(16).toUpperCase()}`;
          const bits = document.createElement("span");
          bits.className = "memory-bits";
          const rowElements = [];
          word.forEach((value, bitIndex) => {
            const bit = document.createElement("span");
            bit.className = "memory-bit";
            bit.textContent = value;
            bit.dataset.row = rowIndex;
            bit.dataset.bit = bitIndex;
            bits.appendChild(bit);
            rowElements.push(bit);
          });
          memoryBitElements.push(rowElements);
          row.append(address, bits);
          memoryGrid.appendChild(row);
        });
      };

      const spawnSteam = (element, intensity = 3) => {
        const rect = element.getBoundingClientRect();
        for (let index = 0; index < intensity; index += 1) {
          window.setTimeout(() => {
            const steam = document.createElement("span");
            steam.className = "steam";
            steam.textContent = Math.random() > 0.5 ? "~" : "..";
            steam.style.left = `${rect.left + rect.width / 2 + randomBetween(-4, 4)}px`;
            steam.style.top = `${rect.top + rect.height / 2}px`;
            steam.style.setProperty("--steam-size", `${randomBetween(7, 11)}px`);
            steam.style.setProperty("--steam-x", `${randomBetween(-18, 18)}px`);
            steam.style.setProperty("--steam-y", `${randomBetween(34, 68)}px`);
            body.appendChild(steam);
            steam.addEventListener("animationend", () => steam.remove(), { once: true });
          }, index * 150);
        }
      };

      const flipMemoryBits = (count) => {
        const touched = new Set();
        while (touched.size < count) {
          const row = Math.floor(Math.random() * memoryWords.length);
          const bit = Math.floor(Math.random() * memoryWords[row].length);
          const key = `${row}:${bit}`;
          if (touched.has(key)) continue;
          touched.add(key);
          memoryWords[row][bit] = memoryWords[row][bit] ? 0 : 1;
          const element = memoryBitElements[row][bit];
          element.textContent = memoryWords[row][bit];
          element.classList.remove("flipped");
          void element.offsetWidth;
          element.classList.add("flipped");
          spawnSteam(element, 2 + Math.floor(Math.random() * 3));
          window.setTimeout(() => element.classList.remove("flipped"), 1200);
        }
      };

      const runMemoryScene = async () => {
        activateScene("memory", memoryScene);
        await sleep(2800);
        const rect = memoryPanel.getBoundingClientRect();
        memoryPanel.classList.remove("struck");
        void memoryPanel.offsetWidth;
        memoryPanel.classList.add("struck");
        for (let index = 0; index < 7; index += 1) {
          window.setTimeout(() => createArc(rect), index * 120);
        }
        await sleep(680);
        flipMemoryBits(4 + Math.floor(Math.random() * 4));
        await sleep(7600);
        memoryPanel.classList.remove("struck");
      };

      const fillXrayBits = () => {
        const bandRect = xrayBand.getBoundingClientRect();
        const style = window.getComputedStyle(xrayBits);
        const fontSize = Number.parseFloat(style.fontSize) || 8;
        const lineHeight = Number.parseFloat(style.lineHeight) || fontSize * 1.08;
        const letterSpacing = Number.parseFloat(style.letterSpacing) || 0;
        const paddingX = (Number.parseFloat(style.paddingLeft) || 0)
          + (Number.parseFloat(style.paddingRight) || 0);
        const paddingY = (Number.parseFloat(style.paddingTop) || 0)
          + (Number.parseFloat(style.paddingBottom) || 0);

        // Courier glyphs are close to 0.6 em wide. Add deliberate overflow so
        // the scanner never exposes blank strips at its right or bottom edge.
        const cellWidth = Math.max(1, fontSize * 0.6001 + letterSpacing);
        const usableWidth = Math.max(1, (bandRect.width || 180) - paddingX);
        const usableHeight = Math.max(1, window.innerHeight - paddingY);
        const columns = Math.max(32, Math.ceil(usableWidth / cellWidth) + 10);
        const rows = Math.max(52, Math.ceil(usableHeight / Math.max(1, lineHeight)) + 8);
        const lines = [];

        for (let row = 0; row < rows; row += 1) {
          let line = "";
          for (let column = 0; column < columns; column += 1) {
            line += Math.random() > 0.5 ? "1" : "0";
          }
          lines.push(line);
        }
        xrayBits.textContent = lines.join("\n");
      };

      const revealIdentityAtBeam = (beamLeft, beamWidth, direction) => {
        const beamRight = beamLeft + beamWidth;
        // The wide band desaturates the normal glyph. Only the bright scan line
        // temporarily exposes the alternate character, then it reverts behind it.
        const scanLineX = direction > 0
          ? beamLeft + beamWidth * 0.84
          : beamLeft + beamWidth * 0.16;
        const scanHalfWidth = Math.max(10, beamWidth * 0.075);
        const scanLeft = scanLineX - scanHalfWidth;
        const scanRight = scanLineX + scanHalfWidth;

        glyphs.forEach((glyph, index) => {
          const rect = glyph.getBoundingClientRect();
          const centre = rect.left + rect.width / 2;
          const inBand = centre >= beamLeft && centre <= beamRight;
          const onScanLine = centre >= scanLeft && centre <= scanRight;

          // Keep the alternate X-ray character visible for the full time the
          // scan band covers this glyph. The narrow bright edge still adds a
          // short highlight, but the character now reads clearly as 7 -> T -> 7.
          glyph.textContent = inBand ? xrayTarget[index] : glyph.dataset.base;
          glyph.classList.toggle("xray-current", inBand && onScanLine);
          glyph.classList.toggle("xray-revealed", inBand && !onScanLine);
        });
      };

      const runXrayScene = async () => {
        const token = activateScene("xray", xrayScene);
        restoreIdentity();
        fillXrayBits();
        const direction = Math.random() > 0.5 ? 1 : -1;
        const width = xrayBand.getBoundingClientRect().width || 180;
        const startX = direction > 0 ? -width - 16 : window.innerWidth + 16;
        const endX = direction > 0 ? window.innerWidth + 16 : -width - 16;
        const duration = randomBetween(21000, 26000);
        xrayBand.classList.toggle("from-right", direction < 0);
        xrayBand.style.opacity = "0.96";
        const started = performance.now();
        await new Promise((resolve) => {
          const step = (now) => {
            if (token !== sceneToken) return resolve();
            const progress = Math.min(1, (now - started) / duration);
            const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            const x = startX + (endX - startX) * eased;
            xrayBand.style.transform = `translate3d(${x}px, 0, 0)`;
            revealIdentityAtBeam(x, width, direction);
            if (progress < 1) return requestAnimationFrame(step);
            resolve();
          };
          requestAnimationFrame(step);
        });
        xrayBand.style.opacity = "0";
        restoreIdentity();
        await sleep(900);
      };

      let hscanMatrix = [];

      const buildHorizontalScanBits = () => {
        const bandRect = hscanBand.getBoundingClientRect();
        const style = window.getComputedStyle(hscanBits);
        const fontSize = Number.parseFloat(style.fontSize) || 8;
        const lineHeight = Number.parseFloat(style.lineHeight) || fontSize * 1.08;
        const letterSpacing = Number.parseFloat(style.letterSpacing) || 0;
        const paddingX = (Number.parseFloat(style.paddingLeft) || 0)
          + (Number.parseFloat(style.paddingRight) || 0);
        const paddingY = (Number.parseFloat(style.paddingTop) || 0)
          + (Number.parseFloat(style.paddingBottom) || 0);
        const cellWidth = Math.max(1, fontSize * 0.6001 + letterSpacing);
        const usableWidth = Math.max(1, window.innerWidth - paddingX);
        const usableHeight = Math.max(1, (bandRect.height || 128) - paddingY);
        const columns = Math.max(64, Math.ceil(usableWidth / cellWidth) + 16);
        const rows = Math.max(8, Math.ceil(usableHeight / Math.max(1, lineHeight)) + 4);

        hscanMatrix = Array.from({ length: rows }, (_, row) => (
          Array.from({ length: columns }, (_, column) => (
            ((row * 11 + column * 7 + Math.floor(Math.random() * 5)) % 9) > 4 ? "1" : "0"
          ))
        ));
        renderHorizontalScanBits();
      };

      const renderHorizontalScanBits = () => {
        hscanBits.textContent = hscanMatrix.map((row) => row.join("")).join("\n");
      };

      const tickHorizontalScanBits = () => {
        if (!hscanMatrix.length) return;
        const rows = hscanMatrix.length;
        const columns = hscanMatrix[0].length;

        // Every row advances like a live serial stream while a smaller set of
        // stored bits flips in place, suggesting hidden activity beneath the UI.
        hscanMatrix.forEach((row, rowIndex) => {
          row.shift();
          const oneBias = 0.32 + 0.26 * (0.5 + 0.5 * Math.sin((performance.now() / 720) + rowIndex));
          row.push(Math.random() < oneBias ? "1" : "0");
        });

        const flipCount = Math.max(12, Math.floor(rows * columns * randomBetween(0.012, 0.035)));
        for (let index = 0; index < flipCount; index += 1) {
          const row = Math.floor(Math.random() * rows);
          const column = Math.floor(Math.random() * columns);
          hscanMatrix[row][column] = hscanMatrix[row][column] === "1" ? "0" : "1";
        }

        renderHorizontalScanBits();
        hscanBits.classList.toggle("live-pulse", Math.random() > 0.63);
      };

      const runHorizontalScanScene = async () => {
        const token = activateScene("hscan", hscanScene);
        buildHorizontalScanBits();
        const direction = Math.random() > 0.5 ? 1 : -1;
        const height = hscanBand.getBoundingClientRect().height || 128;
        const startY = direction > 0 ? -height - 18 : window.innerHeight + 18;
        const endY = direction > 0 ? window.innerHeight + 18 : -height - 18;
        const duration = randomBetween(19000, 24000);
        hscanBand.classList.toggle("from-bottom", direction < 0);
        hscanBand.style.opacity = "0.96";
        hscanBits.classList.remove("live-pulse");
        hscanTimer = window.setInterval(tickHorizontalScanBits, 170);
        const started = performance.now();

        await new Promise((resolve) => {
          const step = (now) => {
            if (token !== sceneToken) return resolve();
            const progress = Math.min(1, (now - started) / duration);
            const eased = progress < 0.5
              ? 2 * progress * progress
              : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            const y = startY + (endY - startY) * eased;
            hscanBand.style.transform = `translate3d(0, ${y}px, 0)`;
            if (progress < 1) return requestAnimationFrame(step);
            resolve();
          };
          requestAnimationFrame(step);
        });

        window.clearInterval(hscanTimer);
        hscanTimer = 0;
        hscanBits.classList.remove("live-pulse");
        hscanBand.style.opacity = "0";
        await sleep(800);
      };

      const runUvScene = async () => {
        const token = activateScene("uv", uvScene);
        const width = uvBand.getBoundingClientRect().width || 160;
        const direction = Math.random() > 0.5 ? 1 : -1;
        const startX = direction > 0 ? -width - 16 : window.innerWidth + 16;
        const endX = direction > 0 ? window.innerWidth + 16 : -width - 16;
        const duration = 17000;
        uvBand.style.opacity = "0.46";
        const started = performance.now();
        await new Promise((resolve) => {
          const step = (now) => {
            if (token !== sceneToken) return resolve();
            const progress = Math.min(1, (now - started) / duration);
            const x = startX + (endX - startX) * progress;
            uvBand.style.transform = `translate3d(${x}px, 0, 0)`;
            if (progress < 1) return requestAnimationFrame(step);
            resolve();
          };
          requestAnimationFrame(step);
        });
        uvBand.style.opacity = "0";
      };

      const createArc = (targetRect = banner.getBoundingClientRect()) => {
        const arc = document.createElement("pre");
        arc.className = "arc";
        arc.textContent = Math.random() > 0.5
          ? "/" + (bs + "/").repeat(7)
          : "--+--/" + (bs + "/").repeat(3) + bs + "--+--";
        const rect = targetRect;
        arc.style.left = `${randomBetween(rect.left - 30, rect.right - 40)}px`;
        arc.style.top = `${randomBetween(rect.top - 25, rect.bottom + 10)}px`;
        arc.style.setProperty("--arc-colour", randomColour());
        arc.style.setProperty("--arc-size", `${randomBetween(10, 18)}px`);
        arc.style.setProperty("--arc-angle", `${randomBetween(-65, 65)}deg`);
        body.appendChild(arc);
        arc.addEventListener("animationend", () => arc.remove(), { once: true });
      };

      const runShockScene = async () => {
        activateScene("shock", shockScene);
        const corruptChars = ["0", "1", "#", "/", bs, "?", "!"];
        glyphs.forEach((glyph, index) => {
          const replacement = corruptChars[Math.floor(Math.random() * corruptChars.length)];
          glyph.dataset.shock = index % 2 ? replacement : glyph.dataset.base;
        });
        for (let burst = 0; burst < 3; burst += 1) {
          for (let index = 0; index < 6; index += 1) window.setTimeout(createArc, index * 95);
          window.setTimeout(() => {
            glyphs.forEach((glyph, index) => {
              if (Math.random() > 0.45) glyph.textContent = index % 2 ? corruptChars[Math.floor(Math.random() * corruptChars.length)] : glyph.dataset.base;
            });
          }, 230);
          await sleep(2500);
          body.classList.remove("scene-shock");
          void body.offsetWidth;
          body.classList.add("scene-shock");
        }
        await sleep(700);
        restoreIdentity();
      };

      const particleGlyphs = [".", "*", "+", ":", "'", "x"];

      const spawnSkullParticle = (x, y, burst = false, angle = Math.random() * Math.PI * 2) => {
        const particle = document.createElement("span");
        particle.className = burst ? "skull-burst" : "skull-particle";
        particle.textContent = particleGlyphs[Math.floor(Math.random() * particleGlyphs.length)];
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        particle.style.setProperty("--particle-colour", randomColour());
        particle.style.setProperty("--spin", `${randomBetween(-150, 150)}deg`);
        if (burst) {
          const distance = randomBetween(24, 66);
          particle.style.setProperty("--burst-x", `${Math.cos(angle) * distance}px`);
          particle.style.setProperty("--burst-y", `${Math.sin(angle) * distance}px`);
          particle.style.setProperty("--burst-size", `${randomBetween(8, 13)}px`);
        } else {
          particle.style.setProperty("--drift-x", `${randomBetween(-15, 15)}px`);
          particle.style.setProperty("--drift-y", `${randomBetween(-34, -12)}px`);
          particle.style.setProperty("--particle-size", `${randomBetween(7, 11)}px`);
        }
        body.appendChild(particle);
        particle.addEventListener("animationend", () => particle.remove(), { once: true });
      };

      const trailSkull = (fromX, fromY, toX, toY, width, height, duration) => {
        const steps = 13;
        for (let step = 1; step <= steps; step += 1) {
          const delay = Math.round((duration / steps) * step);
          window.setTimeout(() => {
            const t = step / steps;
            const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            spawnSkullParticle(
              fromX + (toX - fromX) * eased + width / 2,
              fromY + (toY - fromY) * eased + height / 2
            );
          }, delay);
        }
        window.setTimeout(() => {
          for (let index = 0; index < 10; index += 1) {
            spawnSkullParticle(toX + width / 2, toY + height / 2, true, (Math.PI * 2 * index) / 10);
          }
        }, duration + 40);
      };

      const moveSkull = () => {
        const rect = skull.getBoundingClientRect();
        const bannerRect = banner.getBoundingClientRect();
        const edge = 22;
        const maxX = Math.max(edge, window.innerWidth - rect.width - edge);
        const maxY = Math.max(edge, window.innerHeight - rect.height - edge);
        let x = edge;
        let y = edge;
        for (let attempt = 0; attempt < 80; attempt += 1) {
          const candidateX = randomBetween(edge, maxX);
          const candidateY = randomBetween(edge, maxY);
          const overlaps = candidateX < bannerRect.right + 36 && candidateX + rect.width > bannerRect.left - 36 && candidateY < bannerRect.bottom + 36 && candidateY + rect.height > bannerRect.top - 36;
          if (!overlaps) {
            x = candidateX;
            y = candidateY;
            break;
          }
        }
        const targetX = Math.round(x);
        const targetY = Math.round(y);
        trailSkull(rect.left, rect.top, targetX, targetY, rect.width, rect.height, 6200);
        skull.style.left = `${targetX}px`;
        skull.style.top = `${targetY}px`;
        body.style.setProperty("--skull-colour", randomColour());
      };

      const runSkullAmbient = async () => {
        while (true) {
          await sleep(6600);
          if (!document.hidden) moveSkull();
        }
      };

      const sceneRunners = [
        ["identity", runIdentityScene],
        ["xray", runXrayScene],
        ["hscan", runHorizontalScanScene],
        ["shock", runShockScene],
        ["space", runSpaceScene],
        ["sine", runSineScene],
        ["square", runSquareScene],
        ["emi", runEmiScene],
        ["memory", runMemoryScene],
        ["uv", runUvScene]
      ];

      const sequence = async () => {
        const previewStart = "";
        const requestedStart = previewStart || new URLSearchParams(window.location.search).get("start");
        const requestedIndex = sceneRunners.findIndex(([name]) => name === requestedStart);
        const startIndex = requestedIndex >= 0 ? requestedIndex : 0;
        const ordered = sceneRunners.slice(startIndex).concat(sceneRunners.slice(0, startIndex));
        while (true) {
          for (const [, runner] of ordered) await runner();
        }
      };

      buildMemory();
      resetSine();
      resetSquare();
      renderBitStream();
      renderPowerTrace();
      restoreIdentity();
      moveSkull();

      if (reducedMotion) return;

      runSkullAmbient();
      sequence();

      window.addEventListener("resize", () => {
        ships.forEach((ship) => {
          ship.x = clamp(ship.x, -320, window.innerWidth + 320);
        });
        fillXrayBits();
        buildHorizontalScanBits();
      }, { passive: true });
    })();
  </script>
</body>
</html>
